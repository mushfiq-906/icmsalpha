# Clone Detection Configuration
# Thresholds aligned with NiCad configuration

# Similarity thresholds for global clone mapping (0.0 to 1.0)
# Type 1: Exact clones - require 99% similarity
type1.threshold=0.99

# Type 2: Renamed/parameterized clones - require 99% similarity after normalization  
type2.threshold=0.99

# Type 3: Near-miss clones - require 70% similarity (matches NiCad threshold=0.3)
type3.threshold=0.70

# High similarity threshold for file rename detection
high.similarity=0.90

# Line tolerance for position matching (handles code movement)
line.tolerance=5

# SPCP Analysis thresholds
spcp.similarity=0.65
spcp.max.drop=0.20
spcp.resync=0.05
spcp.max.lag.revisions=5
